# Publish to npm from CI with a provenance attestation, so consumers can check
# which commit and workflow built the tarball (`npm audit signatures`).
# Runs when a release tag (from `yarn release`) is pushed.
# One-time: add an NPM_TOKEN repository secret (an automation token from the
# npm account or org that owns the package).

name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
