name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Tags pushed together (e.g. by a release) must not deploy in parallel
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build docs site
        run: yarn docs:build

      - name: Package build
        run: tar -czf deploy-${{ github.run_id }}.tar.gz -C build .

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy-${{ github.run_id }}.tar.gz
          target: /tmp

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          ARCHIVE: /tmp/deploy-${{ github.run_id }}.tar.gz
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATH,ARCHIVE
          script: |
            set -e
            # /var/www is root-owned; ci needs sudo to create the deploy path
            sudo mkdir -p "$DEPLOY_PATH"
            sudo chown "$USER:$USER" "$DEPLOY_PATH"
            TMP_DIR=$(mktemp -d)
            tar -xzf "$ARCHIVE" -C "$TMP_DIR"
            rsync -a --delete "$TMP_DIR"/ "$DEPLOY_PATH"/
            rm -rf "$TMP_DIR" "$ARCHIVE"
